{% extends "base.html" %}
{% block title %}{{ 'Editar ensaio' if ensaio else 'Novo ensaio' }} — Sistema BMCM{% endblock %}
{% block content %}
<div class="container mt-5 fade-in">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card">
        <div class="card-header"><h1 class="h4 mb-0">{{ 'Editar ensaio' if ensaio else 'Novo ensaio' }}</h1></div>
        <div class="card-body">
          <form method="POST">
            <div class="mb-3">
              <label for="titulo" class="form-label">Título</label>
              <input id="titulo" name="titulo" class="form-control" value="{{ ensaio.titulo if ensaio else 'ENSAIO' }}" maxlength="200" required>
            </div>
            <div class="row g-3">
              <div class="col-md-4">
                <label for="data_ensaio" class="form-label">Data</label>
                <input id="data_ensaio" name="data_ensaio" type="date" class="form-control" value="{{ ensaio.data_ensaio.strftime('%Y-%m-%d') if ensaio and ensaio.data_ensaio else '' }}" required>
              </div>
              <div class="col-md-4">
                <label for="horario" class="form-label">Horário</label>
                <input id="horario" name="horario" type="time" class="form-control" value="{{ ensaio.horario if ensaio else '' }}">
              </div>
              <div class="col-md-4">
                <label for="local" class="form-label">Local</label>
                <input id="local" name="local" class="form-control" maxlength="200" value="{{ ensaio.local if ensaio else '' }}">
              </div>
            </div>
            <div class="mt-3 mb-4">
              <label for="observacoes" class="form-label">Observações</label>
              <textarea id="observacoes" name="observacoes" class="form-control" rows="3">{{ ensaio.observacoes if ensaio else '' }}</textarea>
            </div>
            <div class="mb-4">
              <label for="status" class="form-label">Status</label>
              <select id="status" name="status" class="form-select">
                <option value="AGENDADO" {% if not ensaio or ensaio.status == 'AGENDADO' %}selected{% endif %}>Agendado</option>
                <option value="REALIZADO" {% if ensaio and ensaio.status == 'REALIZADO' %}selected{% endif %}>Realizado</option>
                <option value="CANCELADO" {% if ensaio and ensaio.status == 'CANCELADO' %}selected{% endif %}>Cancelado</option>
              </select>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary"><i class="bi bi-check2-circle me-1" aria-hidden="true"></i>{{ 'Salvar alterações' if ensaio else 'Criar e registrar chamada' }}</button>
              <a href="{{ url_for('main.listar_ensaios') }}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
